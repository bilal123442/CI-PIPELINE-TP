
name: CI-PIPELINE-TP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify dependencies
        run: |
          python -m pytest --version
          python -m flake8 --version

      - name: Lint app and tests with flake8
        run: |
          python -m flake8 app --count --select=E9,F63,F7,F82,F841 --show-source --statistics
          python -m flake8 app --count --max-complexity=10 --max-line-length=127 --statistics
          python -m flake8 tests --count --max-line-length=127 --statistics

      - name: Run tests
        run: |
          python -m pytest -v