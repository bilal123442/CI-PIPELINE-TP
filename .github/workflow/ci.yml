
name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the project source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 4. Lint application code
      - name: Lint app with flake8
        run: |
          flake8 app --count --select=E9,F63,F7,F82,F841 --show-source --statistics
          flake8 app --count --max-complexity=10 --max-line-length=127 --statistics

      # 5. Lint test code
      - name: Lint tests with flake8
        run: |
          flake8 tests --count --max-line-length=127 --statistics

      # 6. Run automated tests
      - name: Run tests with pytest
        run: |
          python -m pytest -v
